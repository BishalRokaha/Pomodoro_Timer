<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO NEXUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <canvas id="particles"></canvas>
    
    <div class="container">
        <div class="header">
            <h1 class="logo">POMODORO NEXUS</h1>
        </div>

        <div class="timer-card" id="timerCard">
            <div style="text-align: center;">
                <div class="mode-badge work" id="modeBadge">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
                    </svg>
                    <span id="modeText">FOCUS MODE</span>
                </div>
            </div>

            <div class="timer-display">
                <div class="timer-circle">
                    <svg class="timer-svg" viewBox="0 0 350 350" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <linearGradient id="gradient-work" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="gradient-break" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="timer-circle-bg" cx="175" cy="175" r="160"/>
                        <circle class="timer-circle-progress work" id="progressCircle" cx="175" cy="175" r="160"/>
                    </svg>
                    <div class="timer-time work" id="timerTime">25:00</div>
                </div>
                <div class="timer-status" id="timerStatus">Ready to focus?</div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn">
                    <span>▶ START</span>
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <span>↻ RESET</span>
                </button>
                <button class="btn btn-tertiary" id="switchBtn">
                    <span>⇄ SWITCH</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="sessionCount">0</div>
                    <div class="stat-label">Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalMinutes">0</div>
                    <div class="stat-label">Minutes</div>
                </div>
            </div>

            <div class="motivation work" id="motivation">
                ⚡ Lock in and dominate! ⚡
            </div>
        </div>
    </div>

    <div class="celebration" id="celebration"></div>
    <script src="script.js"></script>
</body>
</html>
